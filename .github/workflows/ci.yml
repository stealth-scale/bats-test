name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

env:
  SHELLCHECK_VERSION: v0.11.0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components 1 -C "$HOME/.local/bin" "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make lint

  # Every cell: build the image, run its tests inside it, and on main push it.
  image:
    name: image (${{ matrix.distro }}${{ matrix.bash && format(', bash {0}, bats {1}', matrix.bash, matrix.bats) || '' }})
    strategy:
      fail-fast: false
      matrix:
        distro: [alpine]
        bash: ["4.4", "5.1", "5.2", "5.3"]
        bats: ["1.7.0", "1.14.0"]
        include:
          - distro: fedora
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: make test RUNTIME=docker DISTRO=${{ matrix.distro }} BASH_VERSION=${{ matrix.bash }} BATS_VERSION=${{ matrix.bats }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make push RUNTIME=docker DISTRO=${{ matrix.distro }} BASH_VERSION=${{ matrix.bash }} BATS_VERSION=${{ matrix.bats }}
